<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1513">
<title>Zombie Battlefield Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1513;--panel:#151d1b;--panel2:#1a2421;--line:#2a3b37;--ink:#e2e8e4;--muted:#85958f;
  --gold:#d6ad55;--human:#2fe39a;--civ:#a8dcff;--inf:#ff3a2e;--elite:#b565ff;--down:#ff2b2b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-text-size-adjust:100%}
.cond{font-family:"Barlow Condensed",Barlow,sans-serif}

/* ---------- battlefield ---------- */
.field{position:relative;width:100%;height:min(100vh,calc(100vw * 390 / 844));background:#060807;overflow:hidden}
@supports (height:100svh){.field{height:min(100svh,calc(100vw * 390 / 844))}}
@media (min-width:1100px){.field{height:min(88vh,calc(100vw * 390 / 844))}}
.field canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 85% at 50% 52%,transparent 55%,#000a 100%)}
.hud{position:absolute;pointer-events:none;font-family:"Barlow Condensed",sans-serif;text-transform:uppercase}
.hud.tl{top:max(8px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left))}
.hud.tr{top:max(8px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));text-align:right}
.hud.bl{bottom:max(8px,env(safe-area-inset-bottom));left:max(12px,env(safe-area-inset-left));display:flex;gap:6px}
.hud .t1{font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--ink);text-shadow:0 1px 6px #000}
.hud .t2{font-weight:600;font-size:11px;letter-spacing:.2em;color:var(--gold)}
.chip{display:flex;align-items:center;gap:5px;background:#0b100fcc;border:1px solid #2a3b37;border-radius:999px;padding:3px 9px 3px 5px;font-weight:700;font-size:11px;letter-spacing:.12em;color:var(--ink)}
.chip svg{width:16px;height:16px;display:block}

/* ---------- gallery ---------- */
.gallery{max-width:1180px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
.ghead{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:4px}
.ghead h1{margin:0;font:800 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase}
.ghead span{font:600 12px "Barlow Condensed",sans-serif;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}
.group{margin-top:18px}
.group h2{margin:0 0 10px;display:flex;align-items:center;gap:8px;font:700 15px/1 "Barlow Condensed",sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.group h2 i{width:10px;height:10px;border-radius:2px;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{position:relative;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-top:2px solid var(--c);border-radius:10px;overflow:hidden}
.card .pv{aspect-ratio:1/1;background:radial-gradient(ellipse 60% 38% at 50% 66%,#2d3734 0,#1a2220 62%,transparent 100%),linear-gradient(#111816,#18201e)}
.card.proposed{border-style:dashed;border-top-style:solid}
.tag{position:absolute;z-index:6;top:8px;left:8px;font:700 10px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#14110a;background:var(--gold);border-radius:3px;padding:3px 6px}
.meta{padding:8px 10px 10px}
.name{font:800 19px/1 "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase}
.role{margin-top:4px;font-size:12.5px;line-height:1.25;color:#b9c4bf}
.key{margin-top:7px;display:flex;align-items:center;gap:6px;font:600 11px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.key svg{width:20px;height:20px;flex:none}
#gal{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:5}
.foot{margin-top:22px;color:var(--muted);font:600 11px "Barlow Condensed",sans-serif;letter-spacing:.18em;text-transform:uppercase;text-align:center}
@media (max-width:520px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>

<section class="field" id="field">
  <canvas id="fc" aria-label="Convenience Shop battlefield"></canvas>
  <div class="vig"></div>
  <div class="hud tl"><div class="t1">Convenience Shop</div><div class="t2">Hold the checkout</div></div>
  <div class="hud tr"><div class="t2">Visual mock v1</div></div>
  <div class="hud bl">
    <div class="chip"><svg viewBox="-12 -12 24 24"><path d="M-4 -2 L-9 10 L9 10 L4 -2Z" fill="#2fe39a77"/><circle cy="-4" r="5" fill="#2fe39a"/></svg>Squad</div>
    <div class="chip"><svg viewBox="-12 -12 24 24"><circle r="10" fill="#ff3a2e33"/><circle r="5.5" fill="#ff3a2e"/><polygon id="starPts" fill="none" stroke="none"/></svg>Infected</div>
    <div class="chip"><svg viewBox="-12 -12 24 24"><circle r="11" fill="#b565ff44"/><circle r="6.5" fill="#b565ff"/></svg>Elite</div>
  </div>
</section>

<main class="gallery">
  <div class="ghead"><h1>Units</h1><span>Colour · shape · icon</span></div>
  <div id="groups"></div>
  <div class="foot">Mock only · not wired to the game</div>
</main>

<canvas id="gal"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const T = THREE;
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const DPR = Math.min(window.devicePixelRatio || 1, 2);

/* ---------- seeded random ---------- */
let seed = 7;
function rnd(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const R = (a, b) => a + rnd() * (b - a);

/* ---------- colours ---------- */
const C = { human:0x2fe39a, civ:0xa8dcff, inf:0xff3a2e, elite:0xb565ff, gold:0xd6ad55, down:0xff2b2b };
const HEX = { human:'#2fe39a', civ:'#a8dcff', inf:'#ff3a2e', elite:'#b565ff', gold:'#d6ad55', down:'#ff2b2b' };

/* star points for SVG legend */
function starPts(n, ro, ri){ const p=[]; for(let i=0;i<n*2;i++){ const a=i/(n*2)*Math.PI*2-Math.PI/2; const r=i%2?ri:ro; p.push((Math.cos(a)*r).toFixed(2)+','+(Math.sin(a)*r).toFixed(2)); } return p.join(' '); }
document.getElementById('starPts').setAttribute('points', starPts(7, 10, 6.6));

/* ---------- shared geometry / materials ---------- */
const G = {
  box: new T.BoxGeometry(1,1,1),
  ico: new T.IcosahedronGeometry(1,0),
  ico1: new T.IcosahedronGeometry(1,1),
  cyl: new T.CylinderGeometry(1,1,1,7),
  cone: new T.ConeGeometry(1,1,5),
  plane: new T.PlaneGeometry(1,1).rotateX(-Math.PI/2)
};
const mcache = {};
function P(hex, emis){ const k = hex + '|' + (emis||0); return mcache[k] || (mcache[k] = new T.MeshPhongMaterial({ color:hex, emissive:emis||0, flatShading:true, shininess:10, specular:0x1a1a1a })); }
function B(hex, op, add){ return new T.MeshBasicMaterial({ color:hex, transparent:true, opacity:op==null?1:op, depthWrite:false, side:T.DoubleSide, blending:add?T.AdditiveBlending:T.NormalBlending }); }
function part(geo, mat, sx,sy,sz, x,y,z, parent, rx,ry,rz){
  const m = new T.Mesh(geo, mat); m.scale.set(sx,sy,sz); m.position.set(x,y,z);
  if(rx||ry||rz) m.rotation.set(rx||0, ry||0, rz||0);
  m.castShadow = true; parent.add(m); return m;
}

/* flat base geometries (all in the XZ plane, facing up) */
function flatG(g){ g.rotateX(-Math.PI/2); return g; }
function starGeo(n, ro, ri, rh){
  const s = new T.Shape();
  for(let i=0;i<n*2;i++){ const a=i/(n*2)*Math.PI*2+Math.PI/2; const r=i%2?ri:ro; const x=Math.cos(a)*r, y=Math.sin(a)*r; i?s.lineTo(x,y):s.moveTo(x,y); }
  s.closePath(); const h = new T.Path(); h.absarc(0,0,rh,0,Math.PI*2,true); s.holes.push(h);
  return flatG(new T.ShapeGeometry(s, 3));
}
function arcRing(ri, ro, arcs, fill){
  const pos=[], idx=[], seg=6;
  for(let a=0;a<arcs;a++){
    const a0=a/arcs*Math.PI*2, a1=a0+fill/arcs*Math.PI*2, b=pos.length/3;
    for(let i=0;i<=seg;i++){ const t=a0+(a1-a0)*i/seg; pos.push(Math.cos(t)*ri,0,Math.sin(t)*ri, Math.cos(t)*ro,0,Math.sin(t)*ro); }
    for(let i=0;i<seg;i++){ const k=b+i*2; idx.push(k,k+1,k+2, k+1,k+3,k+2); }
  }
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos,3)); g.setIndex(idx); return g;
}
function sectorGeo(len, half, seg){
  const pos=[0,0,0], col=[1,1,1], idx=[];
  for(let i=0;i<=seg;i++){ const a=-half+2*half*i/seg; pos.push(Math.sin(a)*len,0,Math.cos(a)*len); col.push(0,0,0); }
  for(let i=1;i<=seg;i++) idx.push(0,i,i+1);
  const g = new T.BufferGeometry(); g.setAttribute('position', new T.Float32BufferAttribute(pos,3)); g.setAttribute('color', new T.Float32BufferAttribute(col,3)); g.setIndex(idx); return g;
}
const BG = {
  disc: flatG(new T.CircleGeometry(1, 28)),
  ring: flatG(new T.RingGeometry(.72, 1, 32)),
  thin: flatG(new T.RingGeometry(.9, 1, 40)),
  dash: arcRing(.72, 1, 8, .62),
  star: starGeo(7, 1.2, .86, .6),
  hex: flatG(new T.RingGeometry(.7, 1, 6, 1, Math.PI/6)),
  hexDisc: flatG(new T.CircleGeometry(1, 6, Math.PI/6)),
  cone: sectorGeo(4.4, .46, 12)
};

/* ---------- canvas textures ---------- */
function ctex(size, draw){ const c=document.createElement('canvas'); c.width=c.height=size; const x=c.getContext('2d'); draw(x,size); const t=new T.CanvasTexture(c); t.anisotropy=4; return t; }
const TX = {
  glow: ctex(128,(x,s)=>{ const g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(0,0,s,s); }),
  skull: ctex(128,(x)=>{
    x.translate(64,66); x.lineJoin='round';
    const bone=(r)=>{ x.save(); x.rotate(r); x.fillRect(-44,-6,88,12); [[-44,-7],[-44,7],[44,-7],[44,7]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],8,0,7);x.fill();}); x.restore(); };
    x.shadowColor='rgba(0,0,0,.9)'; x.shadowBlur=10;
    x.fillStyle='#f2f2ee'; bone(.7); bone(-.7);
    x.beginPath(); x.arc(0,-14,30,0,7); x.fill(); x.fillRect(-19,2,38,26);
    x.shadowBlur=0; x.fillStyle='#141414';
    x.beginPath(); x.arc(-12,-12,9,0,7); x.fill(); x.beginPath(); x.arc(12,-12,9,0,7); x.fill();
    x.beginPath(); x.moveTo(0,0); x.lineTo(-5,9); x.lineTo(5,9); x.fill();
    x.fillRect(-11,18,3,10); x.fillRect(-2,18,3,10); x.fillRect(7,18,3,10);
  }),
  bubble: ctex(128,(x)=>{
    x.shadowColor='rgba(0,0,0,.8)'; x.shadowBlur=10; x.fillStyle='#f4f4f0';
    x.beginPath(); x.roundRect ? x.roundRect(10,14,108,74,30) : x.rect(10,14,108,74); x.fill();
    x.beginPath(); x.moveTo(34,80); x.lineTo(26,114); x.lineTo(60,84); x.fill();
    x.shadowBlur=0; x.fillStyle='#d42a20'; x.font='900 64px "Barlow Condensed", Arial, sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('!',64,54);
  }),
  reticle: ctex(256,(x)=>{
    x.translate(128,128); x.strokeStyle='#ffffff'; x.lineWidth=7; x.shadowColor='rgba(0,0,0,.9)'; x.shadowBlur=8;
    x.beginPath(); x.arc(0,0,96,0,7); x.stroke(); x.fillStyle='#fff';
    for(let i=0;i<4;i++){ x.save(); x.rotate(i*Math.PI/2); x.beginPath(); x.moveTo(0,-82); x.lineTo(-13,-116); x.lineTo(13,-116); x.closePath(); x.fill(); x.restore(); }
  }),
  floorRing: ctex(128,(x)=>{ x.translate(64,64); const g=x.createRadialGradient(0,0,20,0,0,64); g.addColorStop(0,'rgba(255,255,255,.0)'); g.addColorStop(.7,'rgba(255,255,255,.55)'); g.addColorStop(.86,'rgba(255,255,255,.9)'); g.addColorStop(1,'rgba(255,255,255,0)'); x.fillStyle=g; x.fillRect(-64,-64,128,128); })
};
function icon(col, glyph){
  return ctex(128,(x)=>{
    x.translate(64,64); x.shadowColor='rgba(0,0,0,.9)'; x.shadowBlur=8;
    x.fillStyle='#0d1110'; x.beginPath(); x.arc(0,0,50,0,7); x.fill();
    x.shadowBlur=0; x.lineWidth=7; x.strokeStyle=col; x.stroke();
    x.fillStyle=col; x.strokeStyle=col; x.lineCap='round'; x.lineJoin='round';
    glyph(x);
  });
}
const ICON = {
  star: icon(HEX.gold, x=>{ x.beginPath(); for(let i=0;i<10;i++){ const a=i/10*Math.PI*2-Math.PI/2, r=i%2?13:31; x.lineTo(Math.cos(a)*r,Math.sin(a)*r);} x.fill(); }),
  shield: icon(HEX.elite, x=>{ x.beginPath(); x.moveTo(0,-30); x.lineTo(25,-20); x.quadraticCurveTo(24,16,0,32); x.quadraticCurveTo(-24,16,-25,-20); x.closePath(); x.fill(); }),
  burst: icon(HEX.elite, x=>{ x.beginPath(); x.arc(0,0,14,0,7); x.fill(); for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; x.beginPath(); x.arc(Math.cos(a)*27,Math.sin(a)*27,6,0,7); x.fill(); } }),
  waves: icon(HEX.inf, x=>{ x.lineWidth=7; x.beginPath(); x.arc(-14,0,6,0,7); x.fill(); [16,30].forEach(r=>{ x.beginPath(); x.arc(-14,0,r+4,-.9,.9); x.stroke(); }); }),
  door: icon(HEX.elite, x=>{ x.lineWidth=6; x.strokeRect(-17,-28,34,56); x.lineWidth=7; x.beginPath(); x.moveTo(-6,-30); x.lineTo(6,-8); x.lineTo(-6,6); x.lineTo(8,30); x.stroke(); }),
  claw: icon(HEX.elite, x=>{ x.lineWidth=7; [-16,0,16].forEach(d=>{ x.beginPath(); x.moveTo(d-8,-26); x.quadraticCurveTo(d+10,-4,d-4,28); x.stroke(); }); })
};
function sprite(tex, size, y, op){ const m=new T.SpriteMaterial({ map:tex, depthTest:false, depthWrite:false, transparent:true, opacity:op==null?1:op }); const s=new T.Sprite(m); s.scale.set(size,size,1); s.position.y=y; s.renderOrder=20; return s; }

/* ---------- base markers ---------- */
function makeBase(kind, r){
  /* no platform: soft drop shadow, plus a faint colour haze for infected/elites */
  const g = new T.Group();
  const sh = new T.Mesh(G.plane, new T.MeshBasicMaterial({ map:TX.glow, color:0x000000, transparent:true, opacity:.8, depthWrite:false }));
  sh.scale.set(r*2.2,1,r*2.2); sh.position.y=.025; sh.renderOrder=1; g.add(sh);
  if(kind==='civ'){ const m=new T.Mesh(BG.dash, B(C.civ,1)); m.scale.setScalar(r); m.position.y=.05; m.renderOrder=2; g.add(m); }
  if(kind==='inf'){ const gl=new T.Mesh(G.plane, B(C.inf,.22,true)); gl.material.map=TX.glow; gl.scale.set(r*2.6,1,r*2.6); gl.position.y=.03; gl.renderOrder=1; g.add(gl); }
  if(kind==='elite'){ const gl=new T.Mesh(G.plane, B(C.elite,.6,true)); gl.material.map=TX.glow; gl.scale.set(r*3.4,1,r*3.4); gl.position.y=.03; gl.renderOrder=1; g.add(gl); g.userData.glow=gl; }
  return g;
}

/* ---------- figure rig ---------- */
function rig(o){
  const s=o.s||1, w=o.w||1;
  const root=new T.Group(), body=new T.Group(); root.add(body);
  const hip=.6*s*(o.legLen||1);
  const legs=[-1,1].map(k=>{ const p=new T.Group(); p.position.set(.15*k*s*w,hip,0); body.add(p); part(G.box,o.pants,.22*s*w,hip,.24*s,0,-hip/2,0,p); return p; });
  const torso=new T.Group(); torso.position.y=hip; body.add(torso);
  const th=.62*s*(o.torsoH||1);
  if(o.torsoBox!==false) part(G.box,o.cloth,.62*s*w,th,.38*s*(o.depth||1),0,th/2,0,torso);
  const neck=new T.Group(); neck.position.y=th; torso.add(neck);
  const hr=.2*s*(o.headS||1);
  const head=part(G.ico,o.skin,hr,hr*1.12,hr,0,hr*1.05,0,neck);
  const al=.56*s*(o.armLen||1), aw=.15*s*(o.armW||1);
  const arms=[-1,1].map(k=>{ const p=new T.Group(); p.position.set((.31*w*s+aw*.55)*k, th-.06*s, 0); torso.add(p);
    part(G.box,o.armMat||o.cloth,aw,al,aw,0,-al/2,0,p); part(G.box,o.skin,aw*.9,aw*.8,aw*.9,0,-al-aw*.3,0,p); return p; });
  return { root, body, torso, neck, head, legs, arms, s, hr, th, hip, al };
}
function eyes(r, col){ const m=P(0x220000, col); [-1,1].forEach(k=>part(G.box,m,r.hr*.28,r.hr*.18,r.hr*.1,k*r.hr*.38,r.hr*1.15,r.hr*.95,r.neck)); }

/* palette */
const H = { skin:P(0xb39c8a), fat:P(0x4f7d71, 0x04120d), vest:P(0x24342f), helm:P(0x3f675d, 0x04120d), pants:P(0x343e3b), gun:P(0x2b3232), metal:P(0x5a6260) };
const I = { skin:P(0xa8a290), cloth:P(0x9a2c23, 0x3a0603), pants:P(0x2f2b2a), rag:P(0x4a2a28, 0x120000) };
const E = { skin:P(0x6f5f7d, 0x1a0630), cloth:P(0x4a3a55, 0x14062a), plate:P(0x5d5b68), dark:P(0x262230), glowM:P(0x8a3fd0, 0x7a2fd0) };

/* ---------- unit factory ---------- */
function makeUnit(type){
  const U = { type, fx:[], gait:'idle', ph:R(0,6.28), lean:0 };
  let r, base, k;
  const soldier = (o) => {
    r = rig(Object.assign({ skin:H.skin, cloth:H.fat, pants:H.pants, armLen:1.2 }, o));
    if(o.helmet!==false) part(G.ico1, o.helmM||H.helm, r.hr*1.22, r.hr*.86, r.hr*1.25, 0, r.hr*1.38, -.01, r.neck);
    if(o.vest!==false) part(G.box, o.vestM||H.vest, .7*r.s*(o.w||1), .4*r.s, .46*r.s, 0, r.th*.58, 0, r.torso);
    return r;
  };
  const reach = (arm, x, y, z) => { const d = new T.Vector3(x,y,z).sub(arm.position); const L = d.length(); arm.quaternion.setFromUnitVectors(new T.Vector3(0,-1,0), d.normalize()); arm.scale.y = Math.min(1.4, Math.max(.8, L/(r.al+.06))); };
  const longGun = (len, thick, pump) => {
    const gy = r.th*.5, gx = .1*r.s, gz = .16;
    const g = new T.Group(); g.position.set(gx, gy, gz); g.rotation.x = .08; r.torso.add(g);
    part(G.box, H.gun, .09*thick, .11*thick, len, 0, 0, len*.5, g);
    part(G.box, H.gun, .11, .15, .26, 0, -.03, -.02, g);
    part(G.box, H.gun, .07, .2, .09, 0, -.13, len*.28, g);
    if(pump) part(G.box, H.metal, .14, .14, .24, 0, -.03, len*.62, g);
    reach(r.arms[1], gx+.02, gy-.07, gz+len*.28);
    reach(r.arms[0], gx-.03, gy-.06, gz+len*.6);
    return g;
  };
  switch(type){
    case 'joel':
      soldier({ cloth:P(0x3d4b49), helmet:false });
      part(G.cyl, P(0x262b29), r.hr*1.05, r.hr*.55, r.hr*1.05, 0, r.hr*1.75, 0, r.neck);
      part(G.box, P(0x262b29), r.hr*1.6, r.hr*.12, r.hr*1.1, 0, r.hr*1.55, r.hr*.9, r.neck);
      part(G.box, P(C.gold, 0x3a2a08), .56, .14, .44, 0, r.th-.02, 0, r.torso);
      longGun(1.0, 1);
      base = makeBase('human', 1.05); k='human';
      { const st = sprite(ICON.star, 1.25, 2.75); U.root2 = st; }
      break;
    case 'rifle':

/* per-frame figure animation */
function animate(U, t){
  const r = U.rig, ph = U.ph;
  if(REDUCE){ U.fx.forEach(f=>f(t)); return; }
  switch(U.gait){
    case 'idle': r.body.position.y = Math.sin(t*1.9+ph)*.03; r.torso.rotation.z = Math.sin(t*.9+ph)*.04; break;
    case 'shamble': {
      const s = t*2.3+ph; r.legs[0].rotation.x = Math.sin(s)*.35; r.legs[1].rotation.x = -Math.sin(s)*.35;
      r.body.position.y = Math.abs(Math.sin(s))*.05; r.torso.rotation.z = Math.sin(s*.5)*.14; r.neck.rotation.z = .3+Math.sin(s*.5+1)*.15; break; }
    case 'run': {
      const s = t*13+ph; r.legs[0].rotation.x = Math.sin(s)*.95; r.legs[1].rotation.x = -Math.sin(s)*.95;
      r.arms[0].rotation.x = .9+Math.sin(s)*.5; r.arms[1].rotation.x = .9-Math.sin(s)*.5; r.body.position.y = Math.abs(Math.sin(s))*.12; break; }
    case 'crawl': { const s = t*2.2+ph; r.arms[0].rotation.x = -2.6+Math.sin(s)*.35; r.arms[1].rotation.x = -2.6-Math.sin(s)*.35; r.body.rotation.z = Math.sin(s)*.08; break; }
    case 'stalk': { const s = t*1.6+ph; r.body.position.y = Math.sin(s)*.04; r.arms[0].rotation.x = -1.25+Math.sin(s)*.15; if(U.tail) U.tail.rotation.y = Math.sin(s*1.3)*.4; break; }
  }
  if(U.root2) U.root2.position.y = U.root2.userData.y0 + Math.sin(t*2+ph)*.06;
  if(U.base.userData.glow) U.base.userData.glow.material.opacity = .55 + Math.sin(t*2.6+ph)*.2;
  U.fx.forEach(f=>f(t));
}

function paintFloor(){

  const c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d');
  x.setTransform(sx,0,0,sz,0,0);
  const rooms = [
    { n:'Shop floor', x0:0,  z0:0,  x1:30,  z1:22, col:'#434644', tile:1 },
    { n:'Checkout',   x0:30, z0:0,  x1:63,  z1:22, col:'#474a48', tile:1 },
    { n:'Stockroom',  x0:63, z0:0,  x1:104, z1:22, col:'#3c3f3d', tile:0 },
    { n:'Aisles',     x0:0,  z0:22, x1:39,  z1:58, col:'#414442', tile:1 },
    { n:'Office',     x0:39, z0:22, x1:67,  z1:58, col:'#383c3a', tile:1 },
    { n:'Loading bay',x0:67, z0:22, x1:104, z1:58, col:'#3a3c3a', tile:0 }
  ];
  rooms.forEach(rm=>{
    x.fillStyle=rm.col; x.fillRect(rm.x0,rm.z0,rm.x1-rm.x0,rm.z1-rm.z0);
    x.save(); x.beginPath(); x.rect(rm.x0,rm.z0,rm.x1-rm.x0,rm.z1-rm.z0); x.clip();
    /* large soft tonal drift */
    for(let k=0;k<14;k++){ const px=R(rm.x0,rm.x1), pz=R(rm.z0,rm.z1), rr=R(5,14); const g=x.createRadialGradient(px,pz,0,px,pz,rr); const lt=rnd()<.45; g.addColorStop(0,lt?`rgba(200,204,198,${R(.025,.05)})`:`rgba(8,10,9,${R(.05,.1)})`); g.addColorStop(1,'rgba(0,0,0,0)'); x.fillStyle=g; x.fillRect(px-rr,pz-rr,rr*2,rr*2); }
    /* replaced / worn patches, very low contrast */
    for(let k=0;k<4;k++){ x.save(); x.translate(R(rm.x0+2,rm.x1-2),R(rm.z0+2,rm.z1-2)); x.rotate(R(-.05,.05)); x.fillStyle=`rgba(${rnd()<.5?'0,0,0':'210,212,206'},${R(.025,.045)})`; x.fillRect(0,0,R(3,8),R(2,6)); x.restore(); }
    /* faint slab seams for concrete only */
    if(!rm.tile){ x.strokeStyle='rgba(0,0,0,.09)'; x.lineWidth=.05; x.beginPath(); for(let a=rm.x0+8;a<rm.x1;a+=8){ x.moveTo(a,rm.z0); x.lineTo(a+R(-.3,.3),rm.z1);} x.stroke(); }
    x.restore();

  /* soft stains and grime */
  for(let k=0;k<70;k++){ const px=R(0,MW), pz=R(0,MD), rr=R(1.2,4.5); const g=x.createRadialGradient(px,pz,0,px,pz,rr); g.addColorStop(0,`rgba(14,15,13,${R(.08,.18)})`); g.addColorStop(.6,`rgba(14,15,13,${R(.03,.07)})`); g.addColorStop(1,'rgba(14,15,13,0)'); x.fillStyle=g; x.beginPath(); x.ellipse(px,pz,rr,rr*R(.5,1),R(0,3),0,7); x.fill(); }
  /* scuff paths along the main routes */
  x.strokeStyle='rgba(10,11,10,.06)'; x.lineCap='round'; x.lineWidth=3.2; x.beginPath(); x.moveTo(2,42); x.lineTo(22,40); x.lineTo(38,39); x.moveTo(15,24); x.lineTo(15,20); x.lineTo(28,11); x.lineTo(46,10); x.lineTo(54,24); x.lineTo(54,40); x.lineTo(68,39); x.lineTo(98,42); x.stroke();
  /* wall-edge dirt */
  x.strokeStyle='rgba(0,0,0,.22)'; x.lineWidth=1.6; x.strokeRect(.7,.7,MW-1.4,MD-1.4);
  /* a few cracks */

  const smear=(pts,w)=>{ x.strokeStyle='rgba(80,14,12,.75)'; x.lineCap='round'; x.lineWidth=w; x.beginPath(); pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1])); x.stroke(); };

}

const tmpA = new T.Vector3(), tmpB = new T.Vector3();
function fire(t){
  const west = rnd() < .66; const sh = west ? squadW[(rnd()*squadW.length)|0] : squadS[(rnd()*squadS.length)|0];
  const pool = west ? crowdW.slice(0,5) : crowdS.slice(0,4); const tg = pool[(rnd()*pool.length)|0];
  const tr = tracers.find(q=>q.life<=0); if(!tr) return;
  const a = sh.figure.rotation.y; tmpA.set(sh.root.position.x + Math.sin(a)*1.25, 1.15, sh.root.position.z + Math.cos(a)*1.25);
  tmpB.set(tg.root.position.x + R(-.3,.3), 1.0, tg.root.position.z + R(-.3,.3));
  const L = tmpA.distanceTo(tmpB); tr.m.scale.set(.09,.09,L); tr.m.position.copy(tmpA).lerp(tmpB,.5); tr.m.lookAt(tmpB); tr.m.visible=true; tr.f.position.copy(tmpA); tr.life=1;
  sh.figure.rotation.y = faceTo(sh.root.position.x, sh.root.position.z, tg.root.position.x, tg.root.position.z);
}
function pathPos(path, d){ for(let i=1;i<path.length;i++){ const a=path[i-1], b=path[i], L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(d<=L) return [a[0]+(b[0]-a[0])*d/L, a[1]+(b[1]-a[1])*d/L, Math.atan2(b[0]-a[0],b[1]-a[1])]; d-=L; } const a=path[path.length-2], b=path[path.length-1]; return [b[0],b[1],Math.atan2(b[0]-a[0],b[1]-a[1])]; }
const pathLen = p => p.slice(1).reduce((s,b,i)=>s+Math.hypot(b[0]-p[i][0],b[1]-p[i][1]),0);

function updateField(t, dt){
  units.forEach(U=>{
    const ph=U.ph;
    if(!REDUCE){
      if(U.ctl==='drift'){ U.root.position.x = U.ax + Math.sin(t*.55+ph)*.32; U.root.position.z = U.az + Math.cos(t*.43+ph*1.7)*.32; U.figure.rotation.y = U.face + Math.sin(t*.8+ph)*.25; }
      else if(U.ctl==='wander'){ U.root.position.x = U.ax + Math.sin(t*.18+ph)*1.6; U.root.position.z = U.az + Math.sin(t*.13+ph*2)*1.2; U.figure.rotation.y = Math.atan2(Math.cos(t*.18+ph)*.29, Math.cos(t*.13+ph*2)*.16); }
      else if(U.ctl==='creep'){ const s=(t*.25)%6; U.root.position.x = U.ax + s*1.0; U.root.position.z = U.az - s*.4; }
      else if(U.ctl==='path'){ const L=pathLen(U.path); const lt=(t+ph)%U.period; const d=Math.min(1,lt/U.travel)*L; const p=pathPos(U.path,d); U.root.position.set(p[0],0,p[1]); U.figure.rotation.y=p[2];
        const fadeIn=Math.min(1,lt/.5), fadeOut=Math.min(1,(U.period-lt)/.6); U.root.scale.setScalar(US*Math.max(.001,Math.min(fadeIn,fadeOut)));
        if(U===runner){ U.gait = lt<U.travel ? 'run' : 'shamble'; if(U.trail) U.trail.visible = lt<U.travel; } }
      else if(U.kind==='human' && U.type!=='downed'){ U.figure.rotation.y += (U.face + Math.sin(t*.7+ph)*.12 - U.figure.rotation.y)*Math.min(1,dt*2.5); }
    }
    animate(U,t);
  });
  if(joel.reticle){ joel.reticle.rotation.y = REDUCE?0:t*.6; const s = REDUCE?4.6:4.6+Math.sin(t*3)*.18; joel.reticle.scale.set(s,1,s); }
  units.forEach(U=>{ if(U.bubble) U.bubble.position.y = U.bubble.userData.y0 + (REDUCE?0:Math.abs(Math.sin(t*3))*.25); });
  if(!REDUCE){
    if(t>nextShot){ fire(t); nextShot = t + R(.12,.42); }
    tracers.forEach(q=>{ if(q.life>0){ q.life -= dt*9; const o=Math.max(0,q.life); q.m.material.opacity=o*.95; q.f.material.opacity=o; if(q.life<=0) q.m.visible=false; } });
    lampCheck.intensity = (Math.sin(t*37)>.97 || (t%7)<.12) ? .35 : 1.1;
    const rp = .7+.3*Math.sin(t*3.2); lampRed.intensity = 1.3*rp; U_red.forEach(m=>m.material.opacity=.32+.2*rp);
  }
}

function fitField(){
  const w=fieldEl.clientWidth, h=fieldEl.clientHeight; fr.setSize(w,h,false);
  const aspect=w/h; let halfH=(MD*Math.cos(TILT)+2.6*Math.sin(TILT))/2+1.6, halfW=MW/2+1.4;
  if(halfW/halfH > aspect) halfH = halfW/aspect; else halfW = halfH*aspect;
  Object.assign(fcam,{ left:-halfW, right:halfW, top:halfH, bottom:-halfH }); fcam.updateProjectionMatrix();
}

  return s+'<circle r="11" fill="#b565ff44"/><circle r="6.5" fill="#b565ff"/></svg>';
}
const groupsEl = document.getElementById('groups');
const galItems = [];
CARDS.forEach(gr=>{
  const sec=document.createElement('section'); sec.className='group';
  sec.innerHTML='<h2><i style="background:'+gr.c+'"></i>'+gr.g+'</h2><div class="grid"></div>';
  const grid=sec.querySelector('.grid');
  gr.items.forEach(it=>{
    const card=document.createElement('article'); card.className='card'+(it.p?' proposed':''); card.style.setProperty('--c', it.p?HEX.gold:gr.c);
    card.innerHTML=(it.p?'<span class="tag">Proposed</span>':'')+'<div class="pv"></div><div class="meta"><div class="name">'+it.n+'</div><div class="role">'+it.r+'</div><div class="key">'+keySvg(it.k)+'<span>'+it.kt+'</span></div></div>';
    grid.appendChild(card); galItems.push({ it, el:card.querySelector('.pv') });
  });
  groupsEl.appendChild(sec);
});

const galCanvas = document.getElementById('gal');
const gr = new T.WebGLRenderer({ canvas:galCanvas, antialias:true, alpha:true });
gr.setPixelRatio(DPR); gr.setClearColor(0x000000, 0); gr.autoClear = false;
const gs = new T.Scene();
gs.add(new T.HemisphereLight(0xd0dcd8, 0x22262a, 1.0));
const gk = new T.DirectionalLight(0xffffff, 1.05); gk.position.set(-3, 6, 5); gs.add(gk);
const gRim = new T.DirectionalLight(0x9fd8ff, .55); gRim.position.set(3, 3, -6); gs.add(gRim);
const gcam = new T.OrthographicCamera(-1,1,1,-1,.1,100);
galItems.forEach((g,i)=>{ const U = makeUnit(g.it.t); if(U.root2) U.root2.userData.y0 = U.root2.position.y; if(U.cone) U.cone.scale.setScalar(.42); U.root.visible=false; gs.add(U.root); g.U = U; g.off = i*.7; });

/* =========================================================
   LOOP
   ========================================================= */
let fieldVisible = true, galVisible = false;
const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.target===fieldEl) fieldVisible=e.isIntersecting; else galVisible=e.isIntersecting; }));
io.observe(fieldEl); io.observe(groupsEl);

function sizeGal(){ gr.setSize(window.innerWidth, window.innerHeight, false); }
function renderGal(t){
  const W=window.innerWidth, Hh=window.innerHeight;
  gr.setScissorTest(false); gr.clear(); gr.setScissorTest(true);
  const el = 35*Math.PI/180;
  galItems.forEach(g=>{
    const rc = g.el.getBoundingClientRect();
    if(rc.bottom<0 || rc.top>Hh || rc.right<0 || rc.left>W) return;
    const w=rc.width, h=rc.height, x=rc.left, y=Hh-rc.bottom;
    gr.setViewport(x,y,w,h); gr.setScissor(x,y,w,h);
    const f=g.it.f*1.12, a=w/h, cy=(g.it.y!=null?g.it.y:f*.36);
    Object.assign(gcam,{ left:-f*a, right:f*a, top:f, bottom:-f }); gcam.updateProjectionMatrix();
    gcam.position.set(0, cy + Math.sin(el)*30, Math.cos(el)*30); gcam.lookAt(0, cy, 0);
    const U=g.U; U.root.visible=true;
    U.root.rotation.y = REDUCE ? -.6 : t*.55 + g.off;
    animate(U, t + g.off);
    gr.render(gs, gcam); U.root.visible=false;
  });
}

let last = performance.now()/1000, t0 = last;
function frame(){
  const now = performance.now()/1000, dt = Math.min(.05, now-last); last = now; const t = REDUCE ? 3.0 : now - t0;
  if(fieldVisible){ updateField(t, dt); fr.render(fs, fcam); }
  if(galVisible) renderGal(t);
  if(!REDUCE) requestAnimationFrame(frame);
}
function onResize(){ fitField(); sizeGal(); if(REDUCE){ frame(); } }
window.addEventListener('resize', onResize);
if(REDUCE) window.addEventListener('scroll', ()=>{ galVisible=true; renderGal(3.0); }, { passive:true });

const fontsReady = (document.fonts && document.fonts.load) ? Promise.race([Promise.all([document.fonts.load('800 36px "Barlow Condensed"'), document.fonts.load('900 64px "Barlow Condensed"')]), new Promise(r=>setTimeout(r,1500))]) : Promise.resolve();
fontsReady.then(()=>{
  /* bubble texture repaint after font load */
  buildField(); tracerPool(); populate(); skulls();
  fitField(); sizeGal();
  galVisible = groupsEl.getBoundingClientRect().top < window.innerHeight;
  frame();
});
})();
</script>
</body>
</html>
